[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-shrink"
version = "0.1.0"
description = "Shrink EPUB images for 1-bit e-ink readers such as XTEInk devices running CrossInk"
readme = "README.md"
requires-python = ">=3.10"
# Kept as a TOML table, which setuptools deprecates, because noble must
# build this. PEP 639's SPDX string needs setuptools >= 77.0.0; noble ships
# 68.1.2, which rejects a bare string outright -- "must be valid exactly by
# one definition (2 matches found)", since it matches neither the file nor
# the text form. Measured in an ubuntu:24.04 container on 2026-11-20. Swap
# this for `license = "MIT"` and drop this comment once noble stops being a
# target. This package has no Registry workflow, so its deb is built by
# hand; the sibling packages that do build on noble keep the same form.
license = { text = "MIT" }
authors = [
    { name = "Robert August Vincent II", email = "pillarsdotnet@gmail.com" },
]
dependencies = ["Pillow>=10"]

[project.scripts]
epub-shrink = "epub_shrink:main"

[tool.setuptools]
py-modules = ["epub_shrink"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# D203 and D213 contradict the docstring style the rest of the file uses, and
# ruff warns that each conflicts with another rule in the same set.
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.10"
files = ["epub_shrink.py"]
ignore_missing_imports = false
warn_unused_ignores = true
